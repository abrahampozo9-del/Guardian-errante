<title>El Guardián Errante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Cinzel:wght@700&display=swap">
<style>
  /* Diseño: una sola ambientación oscura (pantalla de juego), sin tema claro a propósito. */
  :root {
    --fondo: #0b0907;
    --tinta: #f2e6cc;
    --oro: #e8c46a;
    --suave: #9a8a70;
    --titulo: Cinzel, Georgia, serif;
    --cuerpo: "Alegreya Sans", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--cuerpo);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #juego {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    background: var(--fondo);
    outline: none;
  }
  #cargando {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 8px;
    text-align: center;
    background: var(--fondo);
    padding-block: 24px;
  }
  #cargando h1 {
    font-family: var(--titulo);
    font-size: clamp(22px, 5vw, 40px);
    margin: 0;
    color: var(--tinta);
    text-wrap: balance;
  }
  #cargando p { margin: 0; color: var(--oro); letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) {
    #cargando p { animation: latido 1.4s ease-in-out infinite; }
  }
  @keyframes latido { 50% { opacity: 0.45; } }
</style>
<canvas id="juego" tabindex="0" aria-label="El Guardián Errante, juego"></canvas>
<div id="cargando"><h1>El Guardián Errante</h1><p>Preparando el barranco del Guadalentín…</p></div>
